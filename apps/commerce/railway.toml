# Railway config for Medusa API or worker — set Root Directory to apps/commerce.
[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` from package-lock; avoid double-install EBUSY on CI cache.
buildCommand = "npm run build"

[deploy]
startCommand = "node scripts/railway-entry.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 120